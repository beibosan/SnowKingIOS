<script>
const A=[{id:1,name:'雪花主号',group:'日常',file:'雪花主号.bin',status:'运行中'},{id:2,name:'小号二',group:'未分组',file:'小号二.bin',status:'待机'},{id:3,name:'测试账号',group:'日常',file:'测试账号.json',status:'待机'},{id:4,name:'小号四',group:'主力号',file:'小号四.bin',status:'待机'},{id:5,name:'小号五',group:'小号池',file:'小号五.bin',status:'待机'},{id:6,name:'小号六',group:'挂机组',file:'小号六.bin',status:'待机'}];let groups=['日常','主力号','小号池','挂机组'],filter='全部',query='',selected=[],vertical=false,vMode=1,hCompact=false,activeSlot=0,scripts=[],nextId=7,themeIndex=2,currentAccount=null,batchMode=false,batchIDs=new Set(),sortDimension='默认',sortAsc=true,syncPreview=false;
const $=id=>document.getElementById(id),icon=id=>`<svg class="icon"><use href="#i-${id}"/></svg>`;
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',1800)}
function renderAccounts(){ $('chips').innerHTML=['全部','未分组',...groups].map(g=>`<button class="chip ${g===filter?'on':''}" onclick="filter='${g}';renderAccounts()">${g}</button>`).join('');let rows=A.filter(a=>(filter==='全部'||a.group===filter)&&(!query||a.name.includes(query)||a.group.includes(query)));if(sortDimension==='名称')rows.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));else if(sortDimension==='日期')rows.sort((a,b)=>a.id-b.id);else if(sortDimension==='大小')rows.sort((a,b)=>a.file.length-b.file.length);if(!sortAsc)rows.reverse();$('accounts').innerHTML=rows.map(a=>`<button class="account ${batchIDs.has(a.id)?'selected':''}" onclick="batchMode?toggleBatch(${a.id}):accountActions(${a.id})"><span class="avatar">${a.name.slice(0,2)}</span><span><span class="name"><strong>${a.name}</strong><span class="state"><i class="dot"></i>${a.status}</span></span><span class="meta">${icon('file')}<span class="path">/Documents/${a.file}</span><span>${a.id===1?'刚刚':'12 分钟前'}</span></span></span></button>`).join('')}
function setPage(page,title,nav){['account','settings','scripts','multi'].forEach(p=>$(p+'-page').classList.toggle('hidden',p!==page));$('title').textContent=title;$('search').classList.toggle('hidden',page!=='account');$('add').classList.toggle('hidden',page!=='account');$('palette').classList.toggle('hidden',page==='scripts'||page==='multi');$('back').classList.toggle('show',page==='scripts');$('bottom').classList.toggle('hidden',page==='scripts');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n===nav))}
function navAccount(btn){setPage('account','雪花之王',btn)}function navSettings(btn){renderSettings();setPage('settings','设置',btn)}
function setting(i,t,s,on,extra=''){return `<button class="setting"><span class="iconbox">${icon(i)}</span><span class="copy"><b>${t}</b><small>${s}</small></span><span class="toggle ${on?'on':''} ${extra}" onclick="event.stopPropagation();this.classList.toggle('on')"></span></button>`}
function renderSettings(){$('settings-page').innerHTML=`<div class="section first">功能设置</div><div class="group"><button class="setting" onclick="showScripts()"><span class="iconbox">${icon('script')}</span><span class="copy"><b>脚本管理</b><small>管理外置 .js 脚本</small></span>${icon('chevron')}</button>${setting('bolt','十殿加速','提升十殿战斗速度',false)}${setting('volume','声音关闭','关闭游戏声音',false)}${setting('eye','隐藏弹窗','仅隐藏首次登录弹窗',false)}${setting('shield','安全识别','仅检查用户导入的外置脚本',true)}</div><div class="section">文件与存储</div><div class="group"><button class="setting" onclick="openStorage()"><span class="iconbox">${icon('folder')}</span><span class="copy"><b>存储管理</b><small>账号持久化、文件导出与缓存清理</small></span>${icon('chevron')}</button></div><div class="section">游戏容器</div><div class="group">${setting('cache','资源缓存','缓存远程游戏资源',true)}${setting('pause','后台暂停','离开窗口后暂停渲染',true)}</div><div class="section">关于</div><div class="group">${setting('info','版本信息','v1.2.2 · build 2 · iOS',false,'hidden')}</div>`}
function showScripts(){renderScripts();setPage('scripts','脚本管理',null)}function showSettings(){navSettings(document.querySelector('[data-page=settings]'))}
function renderScripts(){$('scripts-page').innerHTML=`<div class="banner"><span>导入和管理外置 .js 脚本</span><button class="ibtn small" onclick="toast('打开系统文件选择器导入 .js')">${icon('plus')}</button></div>`+(scripts.length?scripts.map((s,i)=>`<div class="script-card"><span class="iconbox">${icon('script')}</span><span class="copy"><b>${s.name}</b><small>${s.on?'已启用':'已禁用'} · 外置脚本</small></span><span class="toggle ${s.on?'on':''}" onclick="scripts[${i}].on=!scripts[${i}].on;renderScripts()"></span><button class="trash" onclick="scripts.splice(${i},1);renderScripts()">${icon('trash')}</button></div>`).join(''):`<div class="empty-scripts">还没有导入外置脚本</div>`)}
function openAccountImport(){showSheet(`<h2>新增或导入账号</h2><button class="option" onclick="closeModal();$('account-file-input').click()"><span class="iconbox">${icon('file')}</span><span class="copy"><b>导入 BIN/JSON 文件</b><small>从“文件”App选择一个或多个账号文件</small></span>${icon('chevron')}</button><button class="option" onclick="openNamePrompt()"><span class="iconbox">${icon('account')}</span><span class="copy"><b>仅添加名称</b><small>创建不包含登录会话的本地账号</small></span>${icon('chevron')}</button><div class="sheet-actions"><button onclick="closeModal()">取消</button></div>`)}
function openNamePrompt(){showSheet(`<h2>添加本地账号</h2><div class="formrow">${icon('account')}<input id="account-name" type="text" placeholder="账号名称"></div><div class="sheet-actions"><button onclick="openAccountImport()">返回</button><button class="primary" onclick="addNamedAccount()">保存</button></div>`)}
function importPreviewFiles(files){let valid=[...files].filter(f=>/\.(bin|json)$/i.test(f.name));valid.forEach(f=>A.push({id:nextId++,name:f.name.replace(/\.(bin|json)$/i,''),group:'未分组',file:f.name,status:'待机'}));closeModal();filter='全部';renderAccounts();toast(valid.length?`已导入 ${valid.length} 个账号`:'请选择 BIN 或 JSON 文件')}
function addNamedAccount(){let n=$('account-name').value.trim();if(!n)return toast('请输入账号名称');A.push({id:nextId++,name:n,group:'未分组',file:n+'.json',status:'待机'});closeModal();renderAccounts();toast('本地账号已保存')}
function accountActions(id){let a=A.find(x=>x.id===id);showSheet(`<h2>${a.name}</h2><button class="checkrow" onclick="launchGame(${id})">${icon('account')}<span>启动游戏</span>${icon('chevron')}</button><button class="checkrow" onclick="closeAccount(${id})">${icon('close')}<span>关闭账号</span>${icon('chevron')}</button><button class="checkrow" onclick="renameAccount(${id})">${icon('edit')}<span>修改名称</span>${icon('chevron')}</button><button class="checkrow" onclick="closeModal();openGroupManager()">${icon('folder')}<span>移动分组</span>${icon('chevron')}</button><button class="checkrow" onclick="exportAccount(${id})">${icon('save')}<span>导出账号</span>${icon('chevron')}</button><button class="checkrow" onclick="deleteAccount(${id})">${icon('trash')}<span>删除账号</span>${icon('chevron')}</button><div class="sheet-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="launchGame(${id})">确认启动</button></div>`)}
function renameAccount(id){let a=A.find(x=>x.id===id);showSheet(`<h2>修改账号名称</h2><div class="formrow">${icon('edit')}<input id="account-name" value="${a.name}"></div><div class="sheet-actions"><button onclick="accountActions(${id})">取消</button><button class="primary" onclick="let n=$('account-name').value.trim();if(n){a.name=n;closeModal();renderAccounts()}">保存</button></div>`)}
function deleteAccount(id){let i=A.findIndex(x=>x.id===id);if(i>=0)A.splice(i,1);closeModal();renderAccounts()}
function closeAccount(id){let a=A.find(x=>x.id===id);a.status='已关闭';closeModal();renderAccounts();toast(`已关闭：${a.name}`)}
function exportAccount(id){let a=A.find(x=>x.id===id),blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=a.file||`${a.name}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),500);closeModal();toast('已交给浏览器保存文件')}
function launchGame(id){currentAccount=A.find(x=>x.id===id);currentAccount.status='运行中';renderAccounts();closeModal();$('main-top').classList.add('hidden');$('bottom').classList.add('hidden');['account','settings','scripts','multi'].forEach(p=>$(p+'-page').classList.add('hidden'));$('game-page').classList.remove('hidden');renderGame()}
function renderGame(){$('game-page').innerHTML=`<div class="game-toolbar"><button class="game-account" onclick="switchSingleAccount()">${currentAccount.name}　⌄</button><button class="lineup-button" onclick="toast('打开阵容保存面板')">阵容保存</button><button class="game-tool" onclick="toast('正在刷新游戏')">${icon('refresh')}</button><button class="game-tool close" onclick="closeGame()">${icon('close')}</button></div><div class="game-progress"></div><div class="game-view">${currentAccount.name} · 单开游戏视口</div>`}
function switchSingleAccount(){showSheet(`<h2>切换账号</h2>${A.map(a=>`<button class="checkrow" onclick="currentAccount=A.find(x=>x.id===${a.id});closeModal();renderGame()"><span class="check ${a.id===currentAccount.id?'on':''}">${a.id===currentAccount.id?'✓':''}</span><span>${a.name}</span><small>${a.group}</small></button>`).join('')}`)}
function closeGame(){$('game-page').classList.add('hidden');$('main-top').classList.remove('hidden');navAccount(document.querySelector('[data-page=account]'))}
const themes=[{name:'马卡龙色',v:['#ff6b9d','#ffe3ed','#ffd93d','#fff3c4','#6bcb77','#c8f7d4','#4d96ff','#c5e0ff','#f5f7fb','#2d3142','#4a4e69','#fff','#f7f8fc']},{name:'奶油大地',v:['#8a5e49','#ead8ca','#b6925b','#f4e8d4','#788b6b','#e1e9d9','#819290','#e1e9e6','#f6f0e7','#44352c','#725f52','#fffcf7','#f1e9df']},{name:'暖茶森绿',v:['#4f735b','#d6e4d7','#b58b4c','#f1e5c9','#6d9476','#dcebdd','#6c8f86','#ddeae5','#eef3ea','#2f4235','#5d7062','#fbfcf7','#e5ede2']}];
function cycleTheme(){themeIndex=(themeIndex+1)%themes.length;let t=themes[themeIndex],keys=['--pink','--pink-soft','--yellow','--yellow-soft','--mint','--mint-soft','--sky','--sky-soft','--page','--ink','--sub','--card','--field'];keys.forEach((k,i)=>document.documentElement.style.setProperty(k,t.v[i]));toast(t.name)}
function newGroup(){showSheet(`<h2>新建分组</h2><div class="formrow">${icon('folder')}<input id="group-name" type="text" placeholder="分组名称"></div><div class="sheet-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="let n=$('group-name').value.trim();if(n&&!groups.includes(n)){groups.push(n);filter=n;closeModal();renderAccounts()}else toast('请输入不重复的分组名称')">创建</button></div>`)}
function openGroupManager(){showSheet(`<h2>管理分组</h2><div id="manager">${groups.map((g,i)=>`<div class="manager-row">${icon('folder')}<strong onclick="groupMembers(${i})">${g}</strong><small>${A.filter(a=>a.group===g).length} 个</small><button onclick="renameGroup(${i})">${icon('edit')}</button><button class="delete" onclick="deleteGroup(${i})">${icon('trash')}</button></div>`).join('')}</div><div class="sheet-actions"><button onclick="closeModal()">完成</button><button class="primary" onclick="closeModal();newGroup()">新建分组</button></div>`)}
function groupMembers(i){let g=groups[i];showSheet(`<h2>${g} · 账号管理</h2>${A.map(a=>`<button class="checkrow" onclick="assignGroup(${i},${a.id})"><span class="check ${a.group===g?'on':''}">${a.group===g?'✓':''}</span><span>${a.name}</span><small>${a.group}</small></button>`).join('')}<div class="sheet-actions"><button onclick="openGroupManager()">返回</button><button class="primary" onclick="closeModal();renderAccounts()">完成</button></div>`)}
function assignGroup(i,id){let a=A.find(x=>x.id===id),g=groups[i];a.group=a.group===g?'未分组':g;groupMembers(i);renderAccounts()}
function renameGroup(i){let old=groups[i];showSheet(`<h2>修改分组名称</h2><div class="formrow">${icon('edit')}<input id="group-name" value="${old}"></div><div class="sheet-actions"><button onclick="openGroupManager()">取消</button><button class="primary" onclick="let n=$('group-name').value.trim();if(n&&!groups.includes(n)){groups[i]=n;A.forEach(a=>{if(a.group==='${old}')a.group=n});filter=filter==='${old}'?n:filter;renderAccounts();openGroupManager()}else toast('名称为空或已存在')">保存</button></div>`)}
function deleteGroup(i){let g=groups[i];A.forEach(a=>{if(a.group===g)a.group='未分组'});groups.splice(i,1);if(filter===g)filter='全部';renderAccounts();openGroupManager()}
function openBatch(){let running=A.filter(a=>a.status==='运行中').length,idle=A.filter(a=>a.status==='待机').length;showSheet(`<h2>批量操作</h2><div class="stats"><div class="stat"><span><b>${A.length}</b>总账号</span></div><div class="stat"><span><b>${running}</b>运行中</span></div><div class="stat"><span><b>${idle}</b>待机</span></div></div><button class="checkrow" onclick="beginBatch()">${icon('batch')}<span>开始选择账号</span>${icon('chevron')}</button><button class="checkrow" onclick="selectAllBatch()">${icon('account')}<span>全选当前列表</span><small>${batchIDs.size} 个已选</small></button><button class="checkrow" onclick="batchStatus('运行中')">${icon('bolt')}<span>批量启动</span>${icon('chevron')}</button><button class="checkrow" onclick="batchStatus('已关闭')">${icon('close')}<span>批量关闭</span>${icon('chevron')}</button><button class="checkrow" onclick="batchDelete()">${icon('trash')}<span>批量删除</span>${icon('chevron')}</button><div class="sheet-actions"><button onclick="exitBatch()">退出批量模式</button><button class="primary" onclick="closeModal()">完成</button></div>`)}
function beginBatch(){batchMode=true;batchIDs.clear();closeModal();renderAccounts();toast('点击账号进行选择')}
function toggleBatch(id){batchIDs.has(id)?batchIDs.delete(id):batchIDs.add(id);renderAccounts()}
function selectAllBatch(){batchMode=true;batchIDs=new Set(A.filter(a=>(filter==='全部'||a.group===filter)&&(!query||a.name.includes(query)||a.group.includes(query))).map(a=>a.id));closeModal();renderAccounts();toast(`已选择 ${batchIDs.size} 个账号`)}
function requireBatch(){if(batchIDs.size)return true;toast('请先选择账号');return false}
function batchStatus(status){if(!requireBatch())return;A.filter(a=>batchIDs.has(a.id)).forEach(a=>a.status=status);let count=batchIDs.size;exitBatch();toast(`已处理 ${count} 个账号`)}
function batchDelete(){if(!requireBatch())return;for(let i=A.length-1;i>=0;i--)if(batchIDs.has(A[i].id))A.splice(i,1);exitBatch();toast('已批量删除')}
function exitBatch(){batchMode=false;batchIDs.clear();closeModal();renderAccounts()}
function openSort(){showSheet(`<h2>排序方式</h2><div style="font-size:12px;color:var(--sub)">排序维度</div><div class="pills">${['默认','名称','日期','大小'].map(v=>`<button class="sort-pill ${sortDimension===v?'on':''}" onclick="setSort('${v}',sortAsc)">${v}</button>`).join('')}</div><div style="font-size:12px;color:var(--sub)">排序方向</div><div class="pills two"><button class="sort-pill ${sortAsc?'on':''}" onclick="setSort(sortDimension,true)">↑ 升序</button><button class="sort-pill ${!sortAsc?'on':''}" onclick="setSort(sortDimension,false)">↓ 降序</button></div><div class="sheet-actions"><button class="primary" onclick="closeModal()">完成</button></div>`)}
function setSort(d,a){sortDimension=d;sortAsc=a;renderAccounts();openSort()}
function openStorage(){let bytes=JSON.stringify(A).length;showSheet(`<h2>存储管理</h2><div class="stats"><div class="stat"><span><b>${A.length}</b>本地账号</span></div><div class="stat"><span><b>${Math.max(1,Math.ceil(bytes/1024))} KB</b>账号数据</span></div><div class="stat"><span><b>${scripts.length}</b>外置脚本</span></div></div><div class="banner"><span>文件 App / 我的 iPhone / 雪花之王 / SnowKingAccounts</span></div><button class="option" onclick="toast('网页缓存已清理；账号和脚本未删除')"><span class="iconbox">${icon('cache')}</span><span class="copy"><b>清理游戏网页缓存</b><small>不会删除账号、本地脚本或阵容数据</small></span>${icon('chevron')}</button><div class="sheet-actions"><button class="primary" onclick="closeModal()">完成</button></div>`)}
function showSheet(html){$('sheet').innerHTML='<div class="handle"></div>'+html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function openMultiPicker(isVertical,btn){vertical=isVertical;selected=A.slice(0,2).map(a=>a.id);showSheet(`<h2>选择多开账号</h2><div style="color:var(--sub);font-size:11px;margin-bottom:5px">${isVertical?'纵向最多选择 4 个账号':'选择需要同时运行的账号'}</div><div id="pick-list"></div><div class="sheet-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="startMulti(${[...document.querySelectorAll('.nav')].indexOf(btn)})">进入多开</button></div>`);renderPickList()}
function renderPickList(){$('pick-list').innerHTML=A.map(a=>`<button class="checkrow" onclick="togglePick(${a.id})"><span class="check ${selected.includes(a.id)?'on':''}">${selected.includes(a.id)?'✓':''}</span><span>${a.name}</span><small>${a.group}</small></button>`).join('')}
function togglePick(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(!vertical||selected.length<4)selected.push(id);else return toast('纵向多开最多选择 4 个账号');renderPickList()}
function startMulti(navIndex){if(!selected.length)return toast('至少选择一个账号');closeModal();vMode=1;hCompact=false;renderMulti();setPage('multi',vertical?'纵向多开':'横向多开',document.querySelectorAll('.nav')[navIndex])}
function win(a,slot){return `<div class="window ${a?'':'empty'}" ${!a?`onclick="pickSlot(${slot})"`:''}><div class="micro"><i class="dot"></i>${a?a.name:'槽位 '+(slot+1)}${icon(a?'lock':'plus')}</div><div class="viewport">${a?'游戏视口':'点击选择账号'}</div></div>`}
function renderMulti(){let chosen=selected.map(id=>A.find(a=>a.id===id)).filter(Boolean),title=vertical?`纵向多开 · ${chosen.length} 个账号 · 模式 ${vMode}${syncPreview?' · 同步开':''}`:`横向多开 · ${chosen.length} 个窗口 · ${hCompact?'紧凑横屏':'标准横屏'}${syncPreview?' · 同步开':''}`;$('multi-page').innerHTML=`<div class="multi-bar">${icon('grid')}<strong>${title}</strong><button class="ibtn small" onclick="switchLayout()">${icon('layout')}</button><button class="ibtn small ${syncPreview?'active':''}" onclick="toggleSyncPreview()">${icon('lock')}</button><button class="ibtn small danger" onclick="navAccount(document.querySelector('[data-page=account]'))">${icon('close')}</button></div><div id="stage" class="stage"></div>`;if(vertical)renderVertical(chosen);else renderHorizontal(chosen)}
function toggleSyncPreview(){syncPreview=!syncPreview;renderMulti();toast(syncPreview?'触摸同步已开启':'触摸同步已关闭')}
function renderHorizontal(a){$('stage').innerHTML=a.map((account,index)=>`<div class="hrow ${hCompact?'compact':''}">${win(account,index)}</div>`).join('')}
function renderVertical(a){let s=[a[0],a[1],a[2],a[3]];if(vMode===1)$('stage').innerHTML=`<div class="tabs">${s.map((x,i)=>`<button onclick="activeSlot=${i};renderMulti()" class="${i===activeSlot?'on':''}">${x?x.name:'槽'+(i+1)}</button>`).join('')}</div><div class="slotlarge">${win(s[activeSlot],activeSlot)}</div>`;else if(vMode===2)$('stage').innerHTML=`<div class="grid2">${s.map((x,i)=>win(x,i)).join('')}</div>`;else{let others=[0,1,2,3].filter(i=>i!==activeSlot);$('stage').innerHTML=`<div class="focus-top">${others.map(i=>`<div onclick="activeSlot=${i};renderMulti()">${win(s[i],i)}</div>`).join('')}</div><div class="focus-main">${win(s[activeSlot],activeSlot)}</div>`}}
function switchLayout(){if(vertical)vMode=vMode%3+1;else hCompact=!hCompact;renderMulti()}
function pickSlot(slot){showSheet(`<h2>为槽位 ${slot+1} 选择账号</h2>${A.map(a=>`<button class="checkrow" onclick="assignSlot(${slot},${a.id})"><span>${icon('account')}</span><span>${a.name}</span><small>${a.group}</small></button>`).join('')}<div class="sheet-actions"><button onclick="closeModal()">取消</button></div>`)}function assignSlot(slot,id){selected=selected.filter(x=>x!==id);selected.splice(slot,0,id);selected=selected.slice(0,4);closeModal();renderMulti()}
renderAccounts();renderSettings();
if(location.hash==='#scripts')showScripts();
if(location.hash==='#horizontal5'){selected=A.slice(0,5).map(a=>a.id);vertical=false;renderMulti();setPage('multi','横向多开',document.querySelectorAll('.nav')[1])}
if(location.hash.startsWith('#vertical')){selected=A.slice(0,2).map(a=>a.id);vertical=true;vMode=Number(location.hash.replace('#vertical',''))||1;renderMulti();setPage('multi','纵向多开',document.querySelectorAll('.nav')[2])}
if(location.hash==='#game')launchGame(1);
if(location.hash==='#actions')accountActions(1);
if(location.hash==='#batch')openBatch();
if(location.hash==='#import')openAccountImport();
if(location.hash==='#sort')openSort();
if(location.hash==='#storage'){navSettings(document.querySelector('[data-page=settings]'));openStorage()}
if(location.hash==='#sync'){selected=A.slice(0,4).map(a=>a.id);vertical=false;syncPreview=true;renderMulti();setPage('multi','横向多开',document.querySelectorAll('.nav')[1])}
</script></body></html>
